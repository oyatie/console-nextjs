# cargo-audit (RUSTSEC) configuration. Read by the Security workflow from
# backend/. Keep the ignore list in sync with the rationale in backend/deny.toml.
[advisories]
ignore = [
  # rsa remains in the lockfile through optional sqlx-mysql, which this
  # PostgreSQL workspace does not compile. JWT uses the supported AWS-LC
  # provider. This lock-only exception requires the current six-row whole-
  # workspace normal/build/dev guard (tools/check-jwt-provider-graph.py) to
  # pass: no active rsa crate on either Linux target or the Darwin test host.
  # Enabling any new RSA consumer invalidates this exception. The crate is
  # still vulnerable; the unignored audit must retain its finding.
  "RUSTSEC-2023-0071",
  # paste unmaintained (not a vulnerability). Build-time proc-macro pulled
  # transitively by umya-spreadsheet (Excel export); no runtime surface.
  "RUSTSEC-2024-0436",
]
