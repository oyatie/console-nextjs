# Version taken from the already-resolved backend/Cargo.lock (syn 2.0.117), not
# from training data: syn is long-standing transitive graph via the derive
# macros, so the resolver has already verified this version against the registry
# for this lockfile. Reindeer already builds it as the private target `syn-2`.
#
# Direct dependency for backend/ci/gates/writer-ownership ONLY. That gate must
# decide which Rust items are compiled into production builds, and four
# consecutive review rounds proved a hand-written answer cannot: a brace counter
# was defeated by `} // end tests`, then by `use path::{A, B}`, then by a char
# literal `'{'`, a block comment and a raw string; a hand-written cfg predicate
# was defeated by `not(all(test))` and then by `any(test, feature = "x")`, which
# is TRUE in production builds. Each fix was correct and each left a sibling
# spelling live. Parsing Rust with the parser rustc's own ecosystem uses ends
# the enumeration instead of extending it.
syn = { version = "2.0.117", default-features = false, features = ["full", "parsing", "printing", "clone-impls", "visit"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[patch.crates-io]
# Temporary RUSTSEC-2026-0194/RUSTSEC-2026-0195 unblock: upstream calamine
# 0.35.0 and umya-spreadsheet 3.0.0 still constrain quick-xml below the fixed
# 0.41 line. The audited source lives under the repository's Rust third-party
# boundary so Cargo, Reindeer, Buck2, and the image build consume one copy.
# Remove these patches once crates.io can resolve quick-xml >=0.41 without
# local compatibility shims.
calamine = { path = "../third-party/rust/vendor/calamine-0.35.0-quickxml41" }
quick-xml = { path = "../third-party/rust/vendor/quick-xml-0.41.0-compat" }
umya-spreadsheet = { path = "../third-party/rust/vendor/umya-spreadsheet-3.0.0-quickxml41" }

# Inner-loop build tuning (added 2026-07-28). Full debuginfo is the single
# largest cost in a workspace this size and is not needed for `cargo check`,
# clippy, or test runs; line tables keep backtraces useful. Measured context:
# a lane rehearsal recorded `Cache hits: 0%` over 4,084 commands, so every
# parallel lane currently recompiles the whole graph from scratch.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
