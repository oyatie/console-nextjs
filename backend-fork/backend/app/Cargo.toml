[package]
name = "console-app"
version = "0.1.0"
description = "Composition root binary for the maintenance FSM backend."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "console-app"

[[bin]]
name = "console-app"
path = "src/main.rs"

# Cedar/PBAC parity evidence: read-only aggregation of recorded shadow parity
# observations (`authz.cedar_pbac_parity` audit rows) into per-site agree/disagree
# totals + concrete divergent cases. Promotion gate reads this; no REST surface.
[[bin]]
name = "console-cedar-parity-report"
path = "src/bin/console_cedar_parity_report.rs"

[lib]
name = "console_app"
path = "src/lib.rs"

[features]
# Enables the inline PostgreSQL integration suite. This is intentionally inert
# by default so normal unit tests need no database topology.
test-postgres = []
# Genuine browser probes require a built frontend and isolated PostgreSQL.
frontend-e2e = []
# Local role-switch dev-auth endpoint. NOT in `default` (there is no `default`
# key here, so cargo's implicit default feature set is empty) and MUST NEVER be
# added to one — `console-gate-dev-auth-absence` asserts this via `cargo metadata`
# and is wired into CI as a blocking gate.
dev-auth = ["console-platform-auth-rest/dev-auth"]

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
calamine = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
croner = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
hex = { workspace = true }
ipnet = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
console-comms-adapter-imap = { workspace = true }
