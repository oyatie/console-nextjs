[dev-dependencies]
# Test-only verification of the retained original browser-session proof.
openssl = { version = "0.10.80", features = ["vendored"] }
console-platform-test-support = { path = "../crates/platform/test-support" }
console-financial-application = { workspace = true }
console-financial-domain = { workspace = true }
console-governance-application = { workspace = true }
console-notifications-domain = { workspace = true }
# Dev-only: the coverage test asks `DispatchTarget::ALL` what the roster holds.
console-ontology-canonical-domain = { path = "../crates/ontology/canonical-domain" }
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8", "pem"] }
tokio = { workspace = true, features = ["io-util", "net", "macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }

[lints]
workspace = true
