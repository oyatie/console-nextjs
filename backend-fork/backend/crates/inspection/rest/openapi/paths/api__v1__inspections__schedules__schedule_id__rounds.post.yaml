tags:
  - inspections
operationId: completeInspectionRound
summary: Complete a scheduled regular inspection round
security:
- bearerAuth: []
parameters:
- name: schedule_id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/CompleteInspectionRoundRequest'
responses:
  '201':
    description: Inspection round completed.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/InspectionRoundSummary'
  '400':
    $ref: '#/components/responses/ValidationError'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    description: JWT verification is not configured.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
