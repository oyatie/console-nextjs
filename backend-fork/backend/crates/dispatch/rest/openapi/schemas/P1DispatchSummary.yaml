type: object
required:
- id
- work_order_id
- branch_id
- status
- accept_window_started_at
- accept_window_ends_at
- target_count
- accepted_count
- declined_count
- manual_call_required
properties:
  id:
    $ref: '#/components/schemas/Uuid'
  work_order_id:
    $ref: '#/components/schemas/Uuid'
  branch_id:
    $ref: '#/components/schemas/Uuid'
  status:
    $ref: '#/components/schemas/DispatchStatus'
  incident_location:
    $ref: '#/components/schemas/IncidentLocation'
  accept_window_started_at:
    $ref: '#/components/schemas/Timestamp'
  accept_window_ends_at:
    $ref: '#/components/schemas/Timestamp'
  auto_assigned_mechanic_id:
    $ref: '#/components/schemas/Uuid'
  manager_force_pending_at:
    $ref: '#/components/schemas/Timestamp'
  manual_call_required:
    type: boolean
  manual_call_required_at:
    $ref: '#/components/schemas/Timestamp'
  manual_call_cleared_at:
    $ref: '#/components/schemas/Timestamp'
  target_count:
    type: integer
    format: int64
  accepted_count:
    type: integer
    format: int64
  declined_count:
    type: integer
    format: int64
