tags: [p1-dispatches]
operationId: listConsoleDispatchQueue
summary: List the bounded operational dispatch queue
security: [{ bearerAuth: [] }]
parameters:
- name: status
  in: query
  style: form
  explode: false
  schema:
    type: array
    items:
      $ref: '#/components/schemas/DispatchQueueStatus'
  description: Comma-separated DispatchQueueStatus values serialized as one CSV query value.
- name: limit
  in: query
  schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
- name: after
  in: query
  schema: { type: string }
  description: Opaque cursor returned by a previous page.
responses:
  '200': { description: Dispatch queue page., content: { application/json: { schema: { $ref: '#/components/schemas/DispatchQueuePage' } } } }
  '400': { $ref: '#/components/responses/BadRequest' }
  '401': { $ref: '#/components/responses/Unauthorized' }
  '403': { $ref: '#/components/responses/Forbidden' }
  '422': { $ref: '#/components/responses/ValidationError' }
