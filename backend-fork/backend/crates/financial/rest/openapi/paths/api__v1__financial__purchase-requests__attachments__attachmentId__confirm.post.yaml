tags:
  - financial
operationId: confirmPurchaseRequestAttachment
summary: Confirm a completed direct purchase attachment upload
security:
- bearerAuth: []
parameters:
- name: attachmentId
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: Confirmed purchase attachment.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/PurchaseAttachmentUploadRecord'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
