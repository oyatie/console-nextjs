tags:
  - financial
operationId: approvePurchaseRequestExecutive
summary: Executive final approval for above-threshold purchase requests
security:
- bearerAuth: []
parameters:
- $ref: '#/components/parameters/PurchaseRequestId'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/FinancialStepUpRequest'
responses:
  '200':
    description: Purchase request ready to execute.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/PurchaseRequestSummary'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '409':
    $ref: '#/components/responses/Conflict'
  '422':
    $ref: '#/components/responses/ValidationError'
  '428':
    $ref: '#/components/responses/PreconditionRequired'
