type: object
required:
  - lines
  - quote_attachment_ids
  - memo
properties:
  statement_evidence_id:
    type:
      - string
      - "null"
    format: uuid
  amount_won:
    type:
      - integer
      - "null"
    format: int64
    minimum: 1
  lines:
    type: array
    minItems: 1
    items:
      $ref: "#/components/schemas/PurchaseRequestLineInput"
  quote_attachment_ids:
    type: array
    items:
      $ref: "#/components/schemas/Uuid"
  memo:
    type: string
    minLength: 1
