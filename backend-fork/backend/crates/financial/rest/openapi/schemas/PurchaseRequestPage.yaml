type: object
description: Stable offset page for the branch-scoped purchase-request queue.
required:
- items
- limit
- offset
- total
properties:
  items:
    type: array
    items:
      $ref: '#/components/schemas/PurchaseRequestSummary'
  limit:
    type: integer
    format: int64
    minimum: 1
    maximum: 100
  offset:
    type: integer
    format: int64
    minimum: 0
  total:
    type: integer
    format: int64
    minimum: 0
