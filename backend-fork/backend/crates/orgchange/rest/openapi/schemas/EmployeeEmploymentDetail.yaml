type: object
required: [employment_type, phone_e164, base_pay, currency]
properties:
  employment_type:
    type: string
    enum: [REGULAR, CONTRACT, PART_TIME, INTERN]
  phone_e164:
    type: string
  base_pay:
    type: string
    minLength: 4
    maxLength: 15
    pattern: '^(0|[1-9][0-9]{0,11})\.[0-9]{2}$'
  currency:
    type: string
    enum: [KRW]
