type: object
additionalProperties: false
required: [session_token, browser_context, limit, offset]
properties:
  session_token:
    type: string
    minLength: 47
    maxLength: 47
    pattern: '^bs1\.[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
  browser_context:
    type: string
    format: uuid
    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
  limit:
    type: integer
    format: int64
    minimum: 1
    maximum: 1000
  offset:
    type: integer
    format: int64
    minimum: 0
