type: object
additionalProperties: false
description: Rename and/or move a branch across regions; at least one of `name` and `regionId` must be present.
required:
- op
- branchId
properties:
  op:
    type: string
    enum: [RENAME_BRANCH]
  branchId:
    $ref: '#/components/schemas/Uuid'
  name:
    type: string
    minLength: 1
    maxLength: 120
  regionId:
    $ref: '#/components/schemas/Uuid'
