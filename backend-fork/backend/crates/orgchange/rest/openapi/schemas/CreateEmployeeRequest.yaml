type: object
additionalProperties: false
required:
- employee_number
- name
- company
- employment_type
- phone
- org_unit
- position
- site
- home_branch_id
- base_pay
- idempotency_key
properties:
  employee_number:
    type: string
    minLength: 1
  name:
    type: string
    minLength: 1
  company:
    type: string
    minLength: 1
  employment_type:
    type: string
    enum: [REGULAR, CONTRACT, PART_TIME, INTERN]
  phone:
    type: string
    description: Phone number normalized by the server to E.164.
  org_unit:
    type: string
    minLength: 1
  position:
    type: string
    minLength: 1
  site:
    type: string
    minLength: 1
  home_branch_id:
    $ref: '#/components/schemas/Uuid'
  base_pay:
    type: string
    minLength: 1
    maxLength: 15
    pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$'
    description: Canonical non-negative KRW NUMERIC(14,2) decimal; only returned by privileged detail.
  idempotency_key:
    type: string
    minLength: 1
    maxLength: 128
