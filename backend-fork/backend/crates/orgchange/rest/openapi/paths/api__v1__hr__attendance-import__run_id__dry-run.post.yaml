tags:
  - hr
operationId: dryRunAttendanceImport
summary: Resolve employees and branches for a direct attendance import without writing facts
security:
- bearerAuth: []
parameters:
- name: run_id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: Attendance import row readiness and per-row rejection reasons.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/AttendanceImportDryRunSummary'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '422':
    $ref: '#/components/responses/ValidationError'
