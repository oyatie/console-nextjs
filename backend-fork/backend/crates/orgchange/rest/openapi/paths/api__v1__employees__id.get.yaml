tags:
  - employees
operationId: getEmployeeDetail
summary: Read privileged employee employment detail
description: HR directory managers only. Includes compensation and normalized phone; the ordinary directory never includes these fields.
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: Privileged employee detail.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EmployeeDetail'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
