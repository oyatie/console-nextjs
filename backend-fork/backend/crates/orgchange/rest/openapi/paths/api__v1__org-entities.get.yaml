tags:
- org
operationId: listOrgEntities
summary: List group member entities (법인)
description: Active member orgs of every group the caller holds a live grant for; fails closed to an empty list
  when the caller holds no grant.
security:
- bearerAuth: []
responses:
  '200':
    description: Entity list, ordered by org id.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/OrgEntitySummary'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
