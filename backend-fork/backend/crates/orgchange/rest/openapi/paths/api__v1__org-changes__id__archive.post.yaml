tags:
- org
operationId: archiveOrgChange
summary: Archive a settled dissolve
description: SETTLING only, and refused while any settlement item is open. The deferred dissolve ops replay inside
  the archive transaction, so uncleared dependents roll the whole action back (참조 무결성).
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: Archived.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/OrgChangeDetail'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
