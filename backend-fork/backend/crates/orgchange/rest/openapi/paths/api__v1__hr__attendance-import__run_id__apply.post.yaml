tags:
  - hr
operationId: applyAttendanceImport
summary: Apply a dry-run direct attendance import as append-only coordinate-free facts
description: Applies only a DRY_RUN attendance_direct import with no unresolved row errors. It writes lineage-preserving
  attendance_direct_import_events and leaves geofence-derived site_attendance_events unchanged.
security:
- bearerAuth: []
parameters:
- name: run_id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
requestBody:
  required: false
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/ImportApplyRequest'
responses:
  '200':
    description: Apply counts for append-only direct attendance facts.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/AttendanceImportApplyReport'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '422':
    $ref: '#/components/responses/ValidationError'
