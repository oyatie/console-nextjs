tags:
  - hr
operationId: listEmployeeAttendanceRecords
summary: List employee attendance records for HR/payroll review
description: Authorized HR/payroll readers can inspect direct attendance records and their payroll material lineage.
security:
- bearerAuth: []
parameters:
- name: employee_id
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Uuid'
- name: branch_id
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Uuid'
- name: limit
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 1
    maximum: 1000
    default: 500
- name: offset
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 0
    default: 0
responses:
  '200':
    description: Attendance records within the caller's HR review scope.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EmployeeAttendanceRecordPage'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
