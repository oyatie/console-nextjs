tags:
  - hr
operationId: listHrAttendanceSummary
summary: List branch-scoped attendance summaries
description: Read-only summary over durable site attendance events. It exposes business clock-in facts, not raw geolocation
  pings.
security:
- bearerAuth: []
parameters:
- name: branch_id
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Uuid'
- name: limit
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 1
    maximum: 1000
    default: 500
- name: offset
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 0
    default: 0
responses:
  '200':
    description: Attendance summaries for users within the caller's branch scope.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/AttendanceSummaryPage'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
