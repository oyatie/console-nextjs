tags:
- org
operationId: completeOrgChangeSettlementItem
summary: Complete one settlement item
description: SETTLING only; an already-completed item conflicts.
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
- name: itemId
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/CompleteOrgChangeSettlementItemRequest'
responses:
  '200':
    description: Item completed.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/OrgChangeDetail'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
