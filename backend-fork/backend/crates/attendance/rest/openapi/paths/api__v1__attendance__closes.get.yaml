tags: [attendance]
operationId: listAttendanceCloses
summary: List branch-scoped close records
security: [{ bearerAuth: [] }]
parameters:
  - { name: month, in: query, required: true, schema: { type: string, pattern: '^\\d{4}-\\d{2}$' } }
  - { name: branch_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
responses:
  '200': { description: Typed close board, content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceCloseBoard' } } } }
  '401': { $ref: '#/components/responses/Unauthorized' }
  '403': { $ref: '#/components/responses/Forbidden' }
