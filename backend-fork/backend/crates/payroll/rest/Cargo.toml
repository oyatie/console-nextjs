[package]
name = "console-payroll-rest"
version = "0.1.0"
description = "Read-only REST API for the payroll draft-run staging tables: admin run/lines listing and owner self-service."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
console-contracts = { path = "../../contracts" }
axum = { workspace = true }
console-inbox-adapter-postgres = { workspace = true }
console-inbox-application = { workspace = true }
console-inbox-domain = { workspace = true }
console-kernel-core = { workspace = true }
console-payroll-adapter-postgres = { workspace = true }
console-payroll-domain = { workspace = true }
console-platform-auth = { path = "../../platform/auth" }
console-platform-authz = { path = "../../platform/authz" }
console-platform-db = { workspace = true }
console-platform-request-context = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
http = { workspace = true }
console-platform-test-support = { workspace = true }
# Dev-only: the empty-tenant payslip GET sits on Company/OrgUnit/JobPosition/
# Person/hr.appoint. The REST crate must not take a production adapter edge on
# the canonical ports (layer boundary); the gate exempts kind = "dev".
console-ontology-canonical-adapter-postgres = { path = "../../ontology/canonical-adapter-postgres" }
console-ontology-canonical-domain = { path = "../../ontology/canonical-domain" }
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8", "pem"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
