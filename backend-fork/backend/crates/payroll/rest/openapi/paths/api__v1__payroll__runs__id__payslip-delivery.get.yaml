tags:
- payroll
operationId: getPayrollPayslipDelivery
summary: Payslip delivery and acknowledgement readback for a run (audited read)
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
- name: limit
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 1
    maximum: 500
- name: offset
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 0
responses:
  '200':
    description: Delivery counts and a page of delivered payslip links.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/PayrollPayslipDeliverySummary'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
