tags:
- payroll
operationId: listMyPayrollLines
summary: List the signed-in employee's own payroll draft-line (readiness) rows
security:
- bearerAuth: []
parameters:
- name: limit
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 1
    maximum: 500
- name: offset
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 0
responses:
  '200':
    description: Page of the caller's own payroll draft-line rows, newest run period first.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/MyPayrollLinePage'
  '401':
    $ref: '#/components/responses/Unauthorized'
