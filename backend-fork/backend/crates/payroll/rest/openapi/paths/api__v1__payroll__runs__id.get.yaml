tags:
- payroll
operationId: getPayrollRun
summary: Get one payroll draft run and its per-employee readiness lines (admin)
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
- name: limit
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 1
    maximum: 500
- name: offset
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 0
responses:
  '200':
    description: The run, its legal/source-summary context, and a page of lines.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/PayrollRunDetail'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
