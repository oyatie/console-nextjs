tags:
- payroll
operationId: listPayrollRunExceptions
summary: Exception review queue for a run (audited read; OPEN rows first, then danger/warn/info, then age)
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
- name: limit
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 1
    maximum: 500
- name: offset
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 0
responses:
  '200':
    description: Page of run exceptions with the open count.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/PayrollExceptionPage'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
