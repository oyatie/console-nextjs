[package]
name = "console-payroll-ui"
version = "0.1.0"
description = "Payroll Layer::Ui SSR shell. No business authority in the client."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["ssr", "islands"]
ssr = ["dep:axum", "leptos/ssr"]
hydrate = ["dep:wasm-bindgen", "leptos/hydrate"]
islands = ["leptos/islands"]

[dependencies]
axum = { workspace = true, optional = true }
# Version verified live against crates.io 2026-08-28: leptos 0.9.0-beta
# (newest, not yanked, MIT). ADR-0041: 0.8.x is the rollback if beta blocks.
# Not a [workspace.dependencies] pin — HEAD inventory forbids workspace leptos.
leptos = { version = "0.9.0-beta", default-features = false }
serde = { workspace = true }
wasm-bindgen = { version = "0.2.123", optional = true }

[lints]
workspace = true
