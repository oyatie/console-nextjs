tags: [inventory]
operationId: listInventoryConsumptions
summary: List immutable item-consumption events
security: [{ bearerAuth: [] }]
parameters:
  - { name: item_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
  - { name: source_kind, in: query, required: false, schema: { type: string } }
  - { name: work_order_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
  - { name: dispatch_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
  - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
  - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0 } }
responses:
  '200': { description: Consumption event page, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/InventoryConsumptionEvent' } } } } }
  '401': { $ref: '#/components/responses/Unauthorized' }
  '403': { $ref: '#/components/responses/Forbidden' }
  '404': { $ref: '#/components/responses/NotFound' }
