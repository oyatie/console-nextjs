tags: [inventory]
operationId: listInventoryCycleCounts
summary: List tenant- and branch-scoped cycle counts
security: [{ bearerAuth: [] }]
parameters: [{ name: branchId, in: query, required: true, schema: { $ref: '#/components/schemas/Uuid' } }, { name: status, in: query, required: false, schema: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, CANCELLED] } }, { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }, { name: offset, in: query, required: false, schema: { type: integer, minimum: 0 } }]
responses: { '200': { description: Cycle count page, content: { application/json: { schema: { $ref: '#/components/schemas/CycleCountPage' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
