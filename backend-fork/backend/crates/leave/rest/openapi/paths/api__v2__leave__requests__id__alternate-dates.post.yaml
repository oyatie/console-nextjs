tags:
  - leave
operationId: proposeLeaveAlternateDatesV2
summary: Propose worker-chosen alternate 시기 on a §60⑤ consult
description: >-
  Self-service only: the authenticated caller must be the original
  requester of a `time_change_consult` leave request. No
  `employee_directory_manage` capability is required (or sufficient) —
  managers cannot choose the alternate dates. The body carries a new
  inclusive date span that must differ from the original 시기; leave
  type and partial-day period are preserved from the consult row.
  Returns the updated v2 leave-request view with `alternate_*` fields
  populated.
security:
  - bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/LeaveProposeAlternateDatesRequest'
responses:
  '200':
    description: The consult request with worker-proposed alternate dates.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/LeaveRequestV2View'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '422':
    description: >-
      Request is not in `time_change_consult`, dates are invalid or
      identical to the original 시기, or the body carries unknown fields.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '503':
    description: The separately credentialed leave command database is not configured or unavailable.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
