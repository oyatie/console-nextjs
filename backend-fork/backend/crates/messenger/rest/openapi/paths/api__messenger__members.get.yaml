tags:
  - messenger
operationId: listMessengerMembers
summary: List active branch members eligible for messenger thread creation
description: 'Authenticated branch members can discover active coworkers in a branch they are scoped to without requiring
  the admin-only user-management endpoint. The response intentionally excludes phone numbers and other profile fields
  that are not needed to start a work conversation.

  '
security:
- bearerAuth: []
parameters:
- name: branch_id
  in: query
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
- name: limit
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 1
    maximum: 100
    default: 100
responses:
  '200':
    description: Active messenger participants visible in the branch.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/MessengerMemberListResponse'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
