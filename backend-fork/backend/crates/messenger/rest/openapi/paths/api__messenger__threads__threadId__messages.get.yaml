tags:
  - messenger
operationId: listMessengerMessages
summary: Page messenger messages before an optional cursor
security:
- bearerAuth: []
parameters:
- $ref: '#/components/parameters/ThreadId'
- name: before_message_id
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Uuid'
- name: limit
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 1
    maximum: 100
    default: 50
responses:
  '200':
    description: Cursor-stable message page.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/MessengerMessagePage'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
