[package]
name = "console-platform-erasure-ledger"
version = "0.1.0"
description = "Append-only erasure ledger: records what personal data was deleted from the live cluster, at what scope, when, by whom, and under what authority. Appends and reads the per-org hash-chained erasure_ledger table as console_rt under RLS. Records erasures; it does not perform, authorise or re-apply them."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
console-kernel-core = { workspace = true }
console-platform-db = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
console-platform-test-support = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
