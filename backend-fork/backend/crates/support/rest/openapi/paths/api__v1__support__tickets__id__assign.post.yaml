tags:
  - support
operationId: assignSupportTicket
summary: Assign or reassign a support ticket (triages untriaged intake)
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/AssignTicketRequest'
responses:
  '200':
    description: Support ticket assigned.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/SupportTicketSummary'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    description: JWT verification is not configured.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
