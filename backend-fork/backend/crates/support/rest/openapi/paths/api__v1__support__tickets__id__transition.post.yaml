tags:
  - support
operationId: transitionSupportTicket
summary: Drive the support ticket status FSM
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/TransitionTicketRequest'
responses:
  '200':
    description: Support ticket status changed.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/SupportTicketSummary'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    description: JWT verification is not configured.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
