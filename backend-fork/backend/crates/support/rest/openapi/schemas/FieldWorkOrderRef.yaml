type: object
required:
- id
- request_no
- status
- priority
- target_due_at
- report_submitted_at
- result_type
- created_at
properties:
  id:
    $ref: '#/components/schemas/Uuid'
  request_no:
    type: string
  status:
    type: string
    description: Workorder-crate status vocabulary, read-only here.
  priority:
    type: string
  target_due_at:
    type:
    - string
    - 'null'
    format: date-time
  report_submitted_at:
    type:
    - string
    - 'null'
    format: date-time
  result_type:
    type: string
  created_at:
    $ref: '#/components/schemas/Timestamp'
