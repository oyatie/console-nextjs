    $ref: '#/components/schemas/FieldSlaState'
  open:
    type: integer
    format: int64
  breached:
    type: integer
    format: int64
  next_due_at:
    type:
    - string
    - 'null'
    format: date-time
  resolved_within_sla_90d:
    type: integer
    format: int64
  resolved_breached_90d:
    type: integer
    format: int64
