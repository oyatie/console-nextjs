type: object
required: [id, code, title, jurisdiction, citation, impact_area, impact_summary, risk_level, status, metadata, created_by, updated_by, created_at, updated_at]
properties:
  id: { $ref: '#/components/schemas/Uuid' }
  code: { type: string }
  title: { type: string }
  jurisdiction: { type: string }
  regulator: { type: [string, 'null'] }
  citation: { type: string }
  source_url: { type: [string, 'null'], format: uri }
  impact_area: { type: string }
  impact_summary: { type: string }
  risk_level: { $ref: '#/components/schemas/ComplianceRiskLevel' }
  status: { $ref: '#/components/schemas/RegulationImpactStatus' }
  effective_from: { type: [string, 'null'], format: date }
  effective_to: { type: [string, 'null'], format: date }
  review_due_on: { type: [string, 'null'], format: date }
  owner_user_id: { type: [string, 'null'], format: uuid }
  metadata: { type: object, additionalProperties: true }
  created_by: { $ref: '#/components/schemas/Uuid' }
  updated_by: { $ref: '#/components/schemas/Uuid' }
  created_at: { $ref: '#/components/schemas/Timestamp' }
  updated_at: { $ref: '#/components/schemas/Timestamp' }
