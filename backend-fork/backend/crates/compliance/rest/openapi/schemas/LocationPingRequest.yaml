type: object
required:
- latitude
- longitude
- recorded_at
- on_duty
properties:
  branch_id:
    $ref: '#/components/schemas/Uuid'
  latitude:
    type: number
    format: double
    minimum: -90
    maximum: 90
  longitude:
    type: number
    format: double
    minimum: -180
    maximum: 180
  accuracy_m:
    type:
    - number
    - 'null'
    format: double
    minimum: 0
  recorded_at:
    $ref: '#/components/schemas/Timestamp'
  on_duty:
    type: boolean
