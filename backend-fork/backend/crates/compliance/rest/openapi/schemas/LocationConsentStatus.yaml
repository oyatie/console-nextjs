type: object
required:
- consent_id
- user_id
- branch_id
- state
- may_collect
properties:
  consent_id:
    $ref: '#/components/schemas/Uuid'
  user_id:
    $ref: '#/components/schemas/Uuid'
  branch_id:
    $ref: '#/components/schemas/Uuid'
  state:
    $ref: '#/components/schemas/LocationConsentState'
  may_collect:
    type: boolean
  granted_at:
    type:
    - string
    - 'null'
    format: date-time
  suspended_at:
    type:
    - string
    - 'null'
    format: date-time
  resumed_at:
    type:
    - string
    - 'null'
    format: date-time
  withdrawn_at:
    type:
    - string
    - 'null'
    format: date-time
  updated_at:
    type:
    - string
    - 'null'
    format: date-time
