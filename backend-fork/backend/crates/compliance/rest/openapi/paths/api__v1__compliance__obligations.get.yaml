tags: [Compliance]
operationId: listComplianceObligations
summary: List RLS-scoped compliance obligations
security: [{ bearerAuth: [] }]
parameters:
- { name: q, in: query, required: false, schema: { type: string } }
- { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/ObligationStatus' } }
- { name: severity, in: query, required: false, schema: { $ref: '#/components/schemas/ComplianceRiskLevel' } }
- { name: scope_type, in: query, required: false, schema: { $ref: '#/components/schemas/ComplianceScopeKind' } }
- { name: branch_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
- { name: site_id, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
- { name: limit, in: query, required: false, schema: { type: integer, format: int64, minimum: 1, maximum: 1000, default: 100 } }
- { name: offset, in: query, required: false, schema: { type: integer, format: int64, minimum: 0, default: 0 } }
responses:
  '200': { description: Paged obligations within the principal branch scope., content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceObligationPage' } } } }
  '401': { $ref: '#/components/responses/Unauthorized' }
  '403': { $ref: '#/components/responses/Forbidden' }
  '422': { $ref: '#/components/responses/ValidationError' }
  '500': { $ref: '#/components/responses/InternalServerError' }
  '503': { $ref: '#/components/responses/ServiceUnavailable' }
