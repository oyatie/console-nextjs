tags: [Compliance]
operationId: listComplianceFrameworks
summary: List compliance frameworks
security: [{ bearerAuth: [] }]
parameters:
- { name: q, in: query, required: false, schema: { type: string } }
- { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/FrameworkStatus' } }
- { name: kind, in: query, required: false, schema: { $ref: '#/components/schemas/FrameworkKind' } }
- { name: limit, in: query, required: false, schema: { type: integer, format: int64, minimum: 1, maximum: 1000, default: 100 } }
- { name: offset, in: query, required: false, schema: { type: integer, format: int64, minimum: 0, default: 0 } }
responses:
  '200': { description: Paged frameworks., content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceFrameworkPage' } } } }
  '401': { $ref: '#/components/responses/Unauthorized' }
  '403': { $ref: '#/components/responses/Forbidden' }
  '422': { $ref: '#/components/responses/ValidationError' }
  '500': { $ref: '#/components/responses/InternalServerError' }
  '503': { $ref: '#/components/responses/ServiceUnavailable' }
