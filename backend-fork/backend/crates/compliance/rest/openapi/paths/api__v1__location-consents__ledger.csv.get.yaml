tags:
  - location-consents
operationId: exportLocationConsentLedgerCsv
summary: Export the consent lifecycle ledger as CSV
security:
- bearerAuth: []
parameters:
- name: user_id
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Uuid'
- name: branch_id
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Uuid'
- name: limit
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 1
    maximum: 1000
    default: 100
- name: offset
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 0
    default: 0
responses:
  '200':
    description: CSV consent lifecycle ledger export.
    content:
      text/csv:
        schema:
          type: string
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '422':
    $ref: '#/components/responses/ValidationError'
