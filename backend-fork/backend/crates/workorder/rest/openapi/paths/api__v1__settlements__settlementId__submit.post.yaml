tags:
- maintenance
operationId: submitSettlement
summary: Submit a DRAFT settlement for review (creator or completion reviewer)
security:
- bearerAuth: []
parameters:
- name: settlementId
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: The submitted settlement.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/SettlementSummary'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
