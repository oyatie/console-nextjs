tags:
  - work-orders
operationId: rejectWorkOrder
summary: Reject a submitted work order with an audit memo
security:
- bearerAuth: []
parameters:
- $ref: '#/components/parameters/WorkOrderId'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/RejectWorkOrderRequest'
responses:
  '200':
    description: Rejected work order.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/WorkOrderSummary'
  '400':
    $ref: '#/components/responses/ValidationError'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
