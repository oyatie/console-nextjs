type: object
additionalProperties: false
required: [code, label_ko, amount_won, source_url]
properties:
  code:
    type: string
    enum: [NATIONAL_PENSION, HEALTH_INSURANCE, LONG_TERM_CARE, EMPLOYMENT_INSURANCE, INCOME_TAX, LOCAL_INCOME_TAX]
  label_ko: { type: string, minLength: 1 }
  amount_won: { $ref: '#/components/schemas/BrowserPayslipMoney', pattern: '^(?:0|[1-9][0-9]*)$' }
  source_url: { type: string, minLength: 1 }
