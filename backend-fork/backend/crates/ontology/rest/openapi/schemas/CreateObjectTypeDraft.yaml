type: object
description: Draft object-type schema (registry backbone) with its property/link/action/analytic children.
required:
- stable_key
- title
- backing_kind
properties:
  stable_key:
    type: string
  title:
    type: string
  title_property_key:
    type: string
  backing_kind:
    type: string
    enum:
    - projected
    - instance
  backing_table:
    type: string
  primary_key_property:
    type: string
  properties:
    type: array
    items:
      type: object
      additionalProperties: true
  links:
    type: array
    items:
      type: object
      additionalProperties: true
  actions:
    type: array
    items:
      type: object
      additionalProperties: true
  analytics:
    type: array
    items:
      type: object
      additionalProperties: true
