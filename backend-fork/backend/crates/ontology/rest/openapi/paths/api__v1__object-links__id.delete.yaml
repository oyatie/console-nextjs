tags:
  - object-links
operationId: deleteObjectLink
summary: Remove an object link (audited)
description: Hard-deletes the link; the audit event's before-snapshot preserves the removed edge. An unknown id or a
  link owned by another tenant both return 404 (deny-by-omission).
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '204':
    description: The link was removed.
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
