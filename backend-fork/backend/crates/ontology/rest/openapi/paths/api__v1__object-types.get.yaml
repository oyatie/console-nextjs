tags:
  - object-types
operationId: listRegistryObjectTypes
summary: List the object-type registry with caller-visible instance counts
description: 'Returns every seeded object kind (kind, code_prefix, label, lifecycle status) plus active_count —
  the number of instances of that kind visible to the caller. The count respects the SAME per-kind visibility as
  resolveObject: org via forced RLS (no cross-org counting), narrowed by the caller''s branch scope and the
  domain feature gate; a kind the caller cannot read counts 0. Type proposal/transition flows are out of scope
  for this slice (read surface + status only).'
security:
- bearerAuth: []
responses:
  '200':
    description: The object-type registry.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ObjectTypeResponse'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
