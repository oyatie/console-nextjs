tags:
  - link-types
operationId: listLinkTypes
summary: List the edge-type registry (object-link relationship vocabulary)
description: Returns the seeded, platform-wide set of relationship labels an object_link may use. createObjectLink
  validates link_type against this registry.
security:
- bearerAuth: []
responses:
  '200':
    description: The edge-type registry.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/LinkTypeResponse'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
