type: object
required:
- template_key
- role_key
- display_name
- category
- description
- permissions
properties:
  template_key:
    type: string
    pattern: ^[a-z][a-z0-9_]+$
  role_key:
    type: string
    pattern: ^[a-z][a-z0-9_]+$
    description: Suggested custom role key to copy into CreatePolicyRoleRequest.
  display_name:
    type: string
    minLength: 1
    maxLength: 80
  category:
    type: string
    description: Stable grouping key for UI sections.
  description:
    type: string
    maxLength: 512
  permissions:
    type: array
    minItems: 1
    items:
      $ref: '#/components/schemas/PolicyPermissionResponse'
