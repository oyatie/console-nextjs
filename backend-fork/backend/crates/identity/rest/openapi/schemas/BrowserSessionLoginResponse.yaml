type: object
additionalProperties: false
required: [session_token, context_id, expires_at]
properties:
  session_token:
    type: string
    minLength: 47
    maxLength: 47
    pattern: '^bs1\.[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
  context_id:
    type: string
    format: uuid
    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
  expires_at:
    $ref: '#/components/schemas/Timestamp'
