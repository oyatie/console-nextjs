type: object
required:
- display_name
- permissions
- step_up
properties:
  display_name:
    type: string
    minLength: 1
    maxLength: 80
  description:
    type:
    - string
    - 'null'
    maxLength: 512
  permissions:
    type: array
    minItems: 1
    items:
      $ref: '#/components/schemas/PolicyPermissionResponse'
  conditions:
    type: array
    maxItems: 20
    items:
      $ref: '#/components/schemas/PolicyConditionResponse'
  step_up:
    $ref: '#/components/schemas/PasskeyStepUpAssertion'
