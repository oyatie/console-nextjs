type: object
required:
- access_token
- token_type
- refresh_expires_at
- requires_passkey_setup
properties:
  access_token:
    type: string
  refresh_token:
    type: string
    nullable: true
    description: The opaque rotating refresh token in the body transport (mobile). It is null in the cookie transport
      (web), where the token is set as an HttpOnly `console_refresh` cookie and must never reach web JS.
  token_type:
    type: string
    enum:
    - Bearer
  refresh_expires_at:
    $ref: '#/components/schemas/Timestamp'
  requires_passkey_setup:
    type: boolean
    description: Reports key absence, not session purpose. True means the user should enroll a passkey. False never
      grants ordinary authority; legacy OTP families remain enrollment-only after registration and refresh.
      Ordinary work requires a fresh passkey login.
