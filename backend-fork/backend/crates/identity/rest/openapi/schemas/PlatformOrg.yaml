type: object
required:
- id
- slug
- name
- status
- group_id
- group_slug
- group_name
- created_at
- updated_at
properties:
  id:
    $ref: '#/components/schemas/Uuid'
  slug:
    type: string
  name:
    type: string
  status:
    $ref: '#/components/schemas/PlatformOrgStatus'
  group_id:
    type:
    - string
    - 'null'
    format: uuid
  group_slug:
    type:
    - string
    - 'null'
  group_name:
    type:
    - string
    - 'null'
  created_at:
    $ref: '#/components/schemas/Timestamp'
  updated_at:
    $ref: '#/components/schemas/Timestamp'
