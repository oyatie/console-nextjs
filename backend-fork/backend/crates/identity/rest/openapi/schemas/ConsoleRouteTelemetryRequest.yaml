type: object
required:
- event_kind
- route_surface
- route_path
- release_cycle
properties:
  event_kind:
    $ref: '#/components/schemas/ConsoleRouteTelemetryEventKind'
  route_surface:
    $ref: '#/components/schemas/ConsoleRouteSurface'
  route_path:
    type: string
    minLength: 1
    maxLength: 120
    pattern: ^/[A-Za-z0-9._:/-]*$
    description: Cardinality-safe route template; never include raw URL parameters, queries, or fragments.
  release_cycle:
    type: string
    minLength: 1
    maxLength: 80
    pattern: ^[A-Za-z0-9._:-]+$
  duration_ms:
    type:
    - integer
    - 'null'
    format: int32
    minimum: 0
    maximum: 600000
  error_name:
    type:
    - string
    - 'null'
    minLength: 1
    maxLength: 80
    pattern: ^[A-Za-z0-9._:-]+$
