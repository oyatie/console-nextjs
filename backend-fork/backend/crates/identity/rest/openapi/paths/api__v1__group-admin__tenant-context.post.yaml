tags:
  - group-admin
operationId: startGroupAdminTenantContext
summary: Start a bounded group-admin tenant context
description: Mints a short-lived tenant token scoped to a member organization controlled by the actor's group-admin grant.
security:
- bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
        - org_id
        properties:
          org_id:
            $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: Tenant context token for the selected group member organization.
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
