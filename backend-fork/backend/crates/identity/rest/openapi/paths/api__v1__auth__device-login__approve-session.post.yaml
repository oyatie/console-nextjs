tags:
  - auth
operationId: approveDeviceLoginSession
summary: Approve a desktop QR login from an authenticated phone session
description: Phone-side approval for a targeted enrollment QR requires an ordinary authenticated session after passkey
  login. An OTP enrollment family cannot approve, even after registration or refresh. The phone may instead use the
  signed passkey assertion approval endpoint without first minting a session.
security:
- bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/DeviceLoginApproveSessionRequest'
responses:
  '204':
    description: The desktop handoff was approved from the authenticated phone session.
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '429':
    $ref: '#/components/responses/TooManyRequests'
