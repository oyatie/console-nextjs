tags:
  - platform
operationId: listPlatformGroupAccounts
summary: List tenant-anchored accounts with group roles
description: Lists tenant user accounts that hold one or more grants for the selected platform group. Platform token and
  GroupManage authority required.
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: Group account summaries.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PlatformGroupAccount'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
