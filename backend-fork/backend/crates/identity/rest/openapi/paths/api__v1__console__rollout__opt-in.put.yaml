tags:
  - console
operationId: updateConsoleRolloutOptIn
summary: Update the current user's new-console opt-in preference
security:
- bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
        - opt_in
        properties:
          opt_in:
            type: boolean
responses:
  '200':
    description: Updated console rollout status.
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    description: JWT verification is not configured.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
