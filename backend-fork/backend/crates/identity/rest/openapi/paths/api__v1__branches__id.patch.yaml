tags:
  - branches
operationId: updateBranch
summary: Rename a branch or move it to another region
description: Creates a governed DRAFT containing one RENAME_BRANCH proposal; it does not mutate the live row.
security:
- bearerAuth: []
parameters:
- name: Idempotency-Key
  in: header
  required: true
  schema:
    type: string
    minLength: 16
    maxLength: 200
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/UpdateBranchRequest'
responses:
  '200':
    description: Idempotent replay of the existing org-change request.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/OrgChangeDetail'
  '201':
    description: Governed branch-update draft created; no branch row was applied.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/OrgChangeDetail'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
