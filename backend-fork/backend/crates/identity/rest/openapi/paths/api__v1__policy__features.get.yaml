tags:
  - policy
operationId: listPolicyFeatures
summary: List canonical policy feature catalog for Policy Studio
security:
- bearerAuth: []
responses:
  '200':
    description: Canonical features and built-in matrix defaults.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PolicyFeatureResponse'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '503':
    description: JWT verification is not configured.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
