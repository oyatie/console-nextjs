tags:
  - platform
operationId: listPlatformOrgs
summary: List tenant organizations (platform vendor tier)
description: Lists all tenant organizations through the platform extractor. A tenant token is rejected before the handler
  runs; reads are authorized with TenantList and audited as a cross-tenant platform read.
security:
- bearerAuth: []
responses:
  '200':
    description: Tenant organizations visible to the platform operator.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PlatformOrg'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
