tags:
  - policy
operationId: listPolicyAssignments
summary: List custom-role assignments for one user
description: Returns custom-role assignments for a visible user. ACTIVE assignments are audited and can add runtime-effective
  ordinary feature grants on the next request; DRAFT/RETIRED roles remain inert.
security:
- bearerAuth: []
parameters:
- name: user_id
  in: query
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: Planned custom-role assignments for the requested user.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRoleAssignmentResponse'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    description: JWT verification is not configured.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
