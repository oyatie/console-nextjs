tags:
  - regions
operationId: deactivateRegion
summary: Propose deactivating a region
description: Creates a governed DRAFT containing one DEACTIVATE_REGION proposal. The live row is unchanged; preflight
  and apply retain the active-branch guard.
security:
- bearerAuth: []
parameters:
- name: Idempotency-Key
  in: header
  required: true
  schema:
    type: string
    minLength: 16
    maxLength: 200
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: Idempotent replay of the existing org-change request.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/OrgChangeDetail'
  '201':
    description: Governed region-deactivation draft created; no region row was applied.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/OrgChangeDetail'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
