tags:
  - console
operationId: updateConsoleRolloutOrgFlag
summary: Update the org-level new-console rollout flag
security:
- bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
        - enabled
        properties:
          enabled:
            type: boolean
          rollout_note:
            type: string
responses:
  '200':
    description: Updated console rollout status.
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    description: JWT verification is not configured.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
