tags:
  - platform
operationId: exitPlatformTenantContext
summary: End a writable platform-managed tenant context audit trail
description: Records the platform.tenant_context.stop audit event. Called with the operator's real platform token after
  restoring the platform session.
security:
- bearerAuth: []
responses:
  '200':
    description: The exit audit acknowledgement.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/PlatformExitResponse'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
