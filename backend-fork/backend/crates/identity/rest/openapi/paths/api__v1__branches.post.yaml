tags:
  - branches
operationId: createBranch
summary: Propose creating a branch inside a region
description: Creates a governed DRAFT containing one CREATE_BRANCH proposal. The live branches table is unchanged
  until the org-change lifecycle is approved and effectuated. Requires an Idempotency-Key; an exact replay returns
  the existing org-change request with 200.
security:
- bearerAuth: []
parameters:
- name: Idempotency-Key
  in: header
  required: true
  schema:
    type: string
    minLength: 16
    maxLength: 200
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/CreateBranchRequest'
responses:
  '200':
    description: Idempotent replay of the existing org-change request.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/OrgChangeDetail'
  '201':
    description: Governed branch-create draft created; no branch row was applied.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/OrgChangeDetail'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
