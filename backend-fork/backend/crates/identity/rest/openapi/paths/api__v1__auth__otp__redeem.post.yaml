tags:
  - auth
summary: First sign-in by redeeming a one-time code
description: First sign-in for a pre-provisioned user. Verifies a legacy expiring one-time code (admin-issued, or
  the cold-start secret) and mints an enrollment-only token pair. The legacy code is consumed atomically at successful
  passkey registration, not redemption. A wrong, expired or consumed code returns a single generic 401. Rate-limited
  per client (IP and optional device). `requires_passkey_setup` reports key absence, not session purpose; false never
  grants ordinary authority. The family remains enrollment-only after registration and refresh. Ordinary work
  requires a fresh passkey login.
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/OtpRedeemRequest'
responses:
  '200':
    description: Session token pair plus passkey-setup flag.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/OtpRedeemResponse'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '429':
    $ref: '#/components/responses/TooManyRequests'
