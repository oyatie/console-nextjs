tags:
  - me
operationId: getMyWorkbench
summary: Read the authenticated principal's bounded operations workbench
description: >-
  Composes the native action-inbox, owner-scoped todo, and collaboration
  calendar reads under one captured request instant. Each source remains
  independently authorized and may return a redacted denied or unavailable
  envelope; the aggregate never owns mutations or duplicates source data.
security:
- bearerAuth: []
parameters:
- name: from
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Timestamp'
- name: to
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Timestamp'
- name: branch_id
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Uuid'
- name: action_limit
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 50
- name: todo_limit
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 50
- name: calendar_limit
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 50
responses:
  '200':
    description: Workbench source snapshots at one request ceiling.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/MyWorkbenchResponse'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
