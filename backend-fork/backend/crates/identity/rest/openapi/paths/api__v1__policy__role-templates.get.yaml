tags:
  - policy
operationId: listPolicyRoleTemplates
summary: List safe starter templates for tenant custom roles
description: Returns built-in starter templates that can be copied into a tenant custom role definition. Templates never
  grant elevated policy-management features. Templates do not affect runtime authorization until copied into an ACTIVE
  assigned custom role; unsupported/elevated grants remain inert.
security:
- bearerAuth: []
responses:
  '200':
    description: Safe custom-role starter templates.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRoleTemplateResponse'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '503':
    description: JWT verification is not configured.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
