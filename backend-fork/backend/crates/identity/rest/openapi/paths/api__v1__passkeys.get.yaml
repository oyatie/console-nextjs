tags:
  - passkeys
operationId: listPasskeys
summary: List the authenticated user's own passkey credentials
description: Returns the caller's own WebAuthn credentials (id and registration / last-use timestamps). No secret material
  is ever returned.
security:
- bearerAuth: []
responses:
  '200':
    description: The authenticated user's passkey credentials.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/PasskeySummary'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '503':
    description: JWT verification is not configured.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
