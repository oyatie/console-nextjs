tags:
  - policy
operationId: createPolicyRole
summary: Create a tenant custom role definition
description: Creates an audited, tenant-scoped custom role definition. Custom roles never replace built-in users.roles,
  but ACTIVE assignments can add runtime-effective ordinary feature grants on the next request. Elevated policy-management
  and scope-widening features are rejected.
security:
- bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/CreatePolicyRoleRequest'
responses:
  '201':
    description: Custom role definition created.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/PolicyRoleResponse'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '409':
    $ref: '#/components/responses/Conflict'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    description: JWT verification is not configured.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
