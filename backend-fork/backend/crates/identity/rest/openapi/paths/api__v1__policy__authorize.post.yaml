operationId: authorizePolicyDecision
summary: Live Cedar authorization decision
description: The live point decision (the same fail-closed evaluator the guardrail gate calls), optionally scoped to one object
  type or property's attached policies.
tags:
- Policy
security:
- bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/PolicyAuthorizeRequest'
responses:
  '200':
    description: Authorization outcome.
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
