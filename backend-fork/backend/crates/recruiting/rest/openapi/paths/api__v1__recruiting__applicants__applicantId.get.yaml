tags:
- recruiting
operationId: getRecruitApplicant
summary: Applicant detail (audited PII read) with offer versions and the stage timeline
security:
- bearerAuth: []
parameters:
- name: applicantId
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: Applicant, offer versions (newest first), and stage-event history (oldest first).
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/RecruitApplicantDetailResponse'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
