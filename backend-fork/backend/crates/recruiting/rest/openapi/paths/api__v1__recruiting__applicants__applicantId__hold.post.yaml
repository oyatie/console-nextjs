tags:
- recruiting
operationId: holdRecruitApplicant
summary: Set or clear the hold flag
security:
- bearerAuth: []
parameters:
- name: applicantId
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/HoldRecruitApplicantRequest'
responses:
  '200':
    description: The applicant with the new hold state.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/RecruitApplicant'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
