tags:
- recruiting
operationId: recordRecruitOfferReply
summary: Record the candidate's reply on a live offer (ACCEPTED or DECLINED)
security:
- bearerAuth: []
parameters:
- name: offerId
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/RecordRecruitOfferReplyRequest'
responses:
  '200':
    description: The resolved offer.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/RecruitOffer'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '422':
    $ref: '#/components/responses/ValidationError'
