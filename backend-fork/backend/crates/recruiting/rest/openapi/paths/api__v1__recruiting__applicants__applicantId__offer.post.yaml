tags:
- recruiting
operationId: extendRecruitOffer
summary: Extend an offer (assessment-gated; one live offer per applicant)
security:
- bearerAuth: []
parameters:
- name: applicantId
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/ExtendRecruitOfferRequest'
responses:
  '201':
    description: The extended offer; the applicant moves to OFFER.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/RecruitOffer'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '422':
    $ref: '#/components/responses/ValidationError'
