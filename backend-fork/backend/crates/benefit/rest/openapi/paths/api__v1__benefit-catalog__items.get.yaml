tags: [benefit-catalog]
operationId: listBenefitCatalogItems
summary: List tenant-scoped legal or optional benefit catalog items
security: [{ bearerAuth: [] }]
parameters:
- { name: category, in: query, schema: { type: string, enum: [legal, extra] } }
- { name: branchId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
- { name: siteId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
- { name: q, in: query, schema: { type: string } }
- { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
- { name: offset, in: query, schema: { type: integer, minimum: 0 } }
responses:
  '200': { description: Tenant-visible benefit rows, content: { application/json: { schema: { $ref: '#/components/schemas/BenefitCatalogItemPage' } } } }
  '401': { $ref: '#/components/responses/Unauthorized' }
  '403': { $ref: '#/components/responses/Forbidden' }
