tags:
  - sales
operationId: listInquiries
summary: List customer inquiries for the admin inbox (#6)
description: Admin-gated (SalesManage) inquiry inbox. Optional status filter; results are paged.
security:
- bearerAuth: []
parameters:
- name: status
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/InquiryStatus'
- name: limit
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 1
    maximum: 100
    default: 50
- name: offset
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 0
    default: 0
responses:
  '200':
    description: Paged customer inquiries.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/CustomerInquiryPage'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
