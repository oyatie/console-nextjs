tags:
  - storefront
operationId: submitInquiry
summary: Submit a public customer inquiry (#6)
description: Public, unauthenticated lead intake. Accepts the customer's contact details and topic and acknowledges
  receipt without echoing any field. A supplied listing must still be public when the inquiry is recorded; otherwise
  the request returns 409 without recording an inquiry. The caller may explicitly submit a general inquiry.
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/SubmitInquiryRequest'
responses:
  '202':
    description: Inquiry accepted for processing.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/InquiryAck'
  '400':
    $ref: '#/components/responses/ValidationError'
  '409':
    $ref: '#/components/responses/Conflict'
