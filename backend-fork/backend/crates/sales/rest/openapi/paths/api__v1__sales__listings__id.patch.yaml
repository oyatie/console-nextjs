tags:
  - sales
operationId: updateListing
summary: Update a sales listing (#6)
description: 'Admin-gated (SalesManage). Partial update: absent keys are left unchanged; nullable keys explicitly set
  to null clear the column. At least one field must be supplied.'
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/UpdateListingRequest'
responses:
  '204':
    description: The listing was updated.
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '422':
    $ref: '#/components/responses/ValidationError'
