tags:
  - me
operationId: getNotificationsSummary
summary: Per-category unread breakdown for the comms-rail badge, plus the total
security:
- bearerAuth: []
responses:
  '200':
    description: Unread counts grouped by category, for the caller only. Mute-suppressed rows are excluded from total_unread and by_category and tallied separately as muted_unread.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/NotificationCountsSummary'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '503':
    description: JWT verification is not configured.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
