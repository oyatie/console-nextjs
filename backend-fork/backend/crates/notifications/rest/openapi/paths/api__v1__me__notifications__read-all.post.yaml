tags:
  - me
operationId: markAllMyNotificationsRead
summary: Mark all of the authenticated user's unread notifications read
security:
- bearerAuth: []
responses:
  '200':
    description: The number of notifications marked read.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/NotificationReadAllResponse'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '503':
    description: JWT verification is not configured.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
