tags:
  - audit
operationId: listAuditLog
summary: List branch-scoped audit log records
description: Returns append-only audit records visible to the caller's branch scope. Filters are optional and the result
  is paginated to keep the evidence surface bounded.
security:
- bearerAuth: []
parameters:
- name: limit
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 1
    maximum: 200
    default: 50
- name: offset
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 0
    default: 0
- name: target_type
  in: query
  required: false
  schema:
    type: string
- name: actor
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: Paginated audit records.
    content:
      application/json:
        schema:
          type: object
          required:
          - items
          - limit
          - offset
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: true
            limit:
              type: integer
              format: int64
            offset:
              type: integer
              format: int64
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
