operationId: configureLifecycleTransition
summary: Configure a lifecycle transition's requirements
description: Configures the reason / four-eyes / checklist requirements for one object-type lifecycle edge.
tags:
- Governance
security:
- bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/GovernanceConfigureTransitionRequest'
responses:
  '201':
    description: Transition requirements configured.
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    $ref: '#/components/responses/ServiceUnavailable'
