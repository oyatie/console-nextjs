type: object
additionalProperties: false
required: [id, cycle_id, employee_id, employee_name, org_unit, manager_user_id, state, final_grade, rv_code, goals, reviews, calibrated_grade, calibration_reason, calibrated_by, calibrated_at, finalized_at]
properties:
  id: { $ref: '#/components/schemas/Uuid' }
  cycle_id: { $ref: '#/components/schemas/Uuid' }
  employee_id: { $ref: '#/components/schemas/Uuid' }
  employee_name: { type: string }
  org_unit: { type: [string, 'null'] }
  manager_user_id: { $ref: '#/components/schemas/Uuid' }
  state: { $ref: '#/components/schemas/EvaluationSubjectState' }
  final_grade: { oneOf: [{ $ref: '#/components/schemas/EvaluationGrade' }, { type: 'null' }] }
  rv_code: { type: [string, 'null'] }
  goals: { type: array, items: { $ref: '#/components/schemas/EvaluationGoal' } }
  reviews: { type: array, items: { $ref: '#/components/schemas/EvaluationReview' } }
  calibrated_grade: { oneOf: [{ $ref: '#/components/schemas/EvaluationGrade' }, { type: 'null' }] }
  calibration_reason: { type: [string, 'null'] }
  calibrated_by: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
  calibrated_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
  finalized_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
