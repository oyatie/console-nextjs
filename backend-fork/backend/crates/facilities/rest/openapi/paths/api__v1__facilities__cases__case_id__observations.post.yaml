tags: [facilities]
operationId: recordFacilitiesObservation
summary: Record facilities energy or cost observations and return the case readback
security: [{ bearerAuth: [] }]
parameters: [{ name: case_id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FacilitiesObservationRequest' } } } }
responses:
  '200': { description: Case with derived energy and cost readback, content: { application/json: { schema: { $ref: '#/components/schemas/FacilitiesCase' } } } }
  '401': { $ref: '#/components/responses/Unauthorized' }
  '403': { $ref: '#/components/responses/Forbidden' }
  '404': { $ref: '#/components/responses/NotFound' }
  '409': { $ref: '#/components/responses/Conflict' }
  '422': { $ref: '#/components/responses/ValidationError' }
  '500': { $ref: '#/components/responses/InternalServerError' }
  '503': { $ref: '#/components/responses/ServiceUnavailable' }
