tags:
- notices
operationId: publishNotice
summary: Publish a draft (NoticeManage only); issues the NT- code, snapshots recipients, fans out notifications
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: The published notice.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/NoticeSummary'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '422':
    $ref: '#/components/responses/ValidationError'
