tags:
- notices
operationId: listNoticeReceipts
summary: 수령확인 receipts drill for one notice (NoticeManage only); acknowledged=false is the outstanding chase list
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
- name: acknowledged
  in: query
  required: false
  schema:
    type: boolean
- name: limit
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 1
    maximum: 200
    default: 50
- name: offset
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 0
    default: 0
responses:
  '200':
    description: Recipient receipts, newest acknowledgment first, then display name.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/NoticeReceiptPage'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
