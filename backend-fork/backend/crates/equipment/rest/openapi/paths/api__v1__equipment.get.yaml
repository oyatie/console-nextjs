tags:
  - equipment
operationId: autocompleteEquipment
summary: Autocomplete branch-scoped equipment by management number, equipment number, or model
security:
- bearerAuth: []
parameters:
- name: q
  in: query
  required: true
  schema:
    type: string
    minLength: 1
- name: limit
  in: query
  required: false
  schema:
    type: integer
    format: int64
    minimum: 1
    maximum: 20
    default: 10
responses:
  '200':
    description: Prefix-search equipment matches.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EquipmentAutocompletePage'
  '400':
    $ref: '#/components/responses/ValidationError'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
