[package]
name = "console-comms-adapter-mox"
version = "0.1.0"
description = "Legacy mox webmail adapter: inbound webhook and connection probe; outbound submission is unarmed."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
console-comms-application = { workspace = true }
