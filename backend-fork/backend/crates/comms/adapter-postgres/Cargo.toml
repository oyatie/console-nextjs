[package]
name = "console-comms-adapter-postgres"
version = "0.1.0"
description = "Postgres adapter for webmail: RLS-armed account and immutable outbound preparation, with write-only credentials."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
console-comms-application = { workspace = true }
console-comms-domain = { workspace = true }
console-kernel-core = { workspace = true }
console-platform-db = { workspace = true }
console-platform-request-context = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
console-comms-credential-cipher = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
secrecy = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
