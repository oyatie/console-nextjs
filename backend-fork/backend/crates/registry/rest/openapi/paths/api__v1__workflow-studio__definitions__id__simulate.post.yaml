tags:
  - workflow-studio
operationId: simulateWorkflowDefinition
summary: Simulate publish readiness without writing
description: Validates the workflow definition, required approval/payment lines, conditional notification rules, and
  connector/action allowlist without mutating state. Use this before passkey-gated publication.
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/SimulateWorkflowDefinitionRequest'
responses:
  '200':
    description: Simulation result.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/WorkflowSimulationResponse'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '422':
    $ref: '#/components/responses/ValidationError'
