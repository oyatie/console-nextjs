tags:
  - equipment-substitutions
operationId: returnEquipmentSubstitute
summary: Return an active substitute (대차) assignment
description: Audited equipment-lifecycle write. Requires EquipmentManage (ADMIN/EXECUTIVE/SUPER_ADMIN).
security:
- bearerAuth: []
parameters:
- $ref: '#/components/parameters/EquipmentSubstitutionId'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/ReturnSubstituteRequest'
responses:
  '200':
    description: Substitute assignment returned.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/SubstituteAssignment'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '422':
    $ref: '#/components/responses/ValidationError'
  '503':
    description: JWT verification is not configured.
