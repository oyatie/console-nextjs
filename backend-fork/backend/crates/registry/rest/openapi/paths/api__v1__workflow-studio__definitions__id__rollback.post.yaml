tags:
  - workflow-studio
operationId: rollbackWorkflowDefinition
summary: Roll back by appending a new active version copied from history
security:
- bearerAuth: []
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/RollbackWorkflowDefinitionRequest'
responses:
  '200':
    description: Rolled back workflow definition.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/WorkflowDefinitionResponse'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '428':
    description: Fresh passkey step-up is required.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
  '422':
    $ref: '#/components/responses/ValidationError'
