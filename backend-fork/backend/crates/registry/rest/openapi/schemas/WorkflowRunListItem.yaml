type: object
required:
- run_id
- status
- definition_id
- definition_version
- started_at
- updated_at
properties:
  run_id:
    $ref: '#/components/schemas/Uuid'
  status:
    type: string
  definition_id:
    $ref: '#/components/schemas/Uuid'
  definition_version:
    type: integer
    format: int32
  object_type:
    type: string
  object_id:
    $ref: '#/components/schemas/Uuid'
  initiated_by:
    $ref: '#/components/schemas/Uuid'
  started_at:
    $ref: '#/components/schemas/Timestamp'
  updated_at:
    $ref: '#/components/schemas/Timestamp'
