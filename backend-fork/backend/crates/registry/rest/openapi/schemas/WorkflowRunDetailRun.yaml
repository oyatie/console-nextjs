type: object
required:
- id
- status
- definition_id
- definition_version
- trigger_type
- started_at
- updated_at
properties:
  id:
    $ref: '#/components/schemas/Uuid'
  status:
    type: string
  definition_id:
    $ref: '#/components/schemas/Uuid'
  definition_version:
    type: integer
    format: int32
  trigger_type:
    type: string
  object_type:
    type: string
  object_id:
    $ref: '#/components/schemas/Uuid'
  initiated_by:
    $ref: '#/components/schemas/Uuid'
  error_payload:
    type: object
    additionalProperties: true
    description: Failure reason for FAILED/DEAD_LETTERED runs (dead-letter visibility).
  started_at:
    $ref: '#/components/schemas/Timestamp'
  updated_at:
    $ref: '#/components/schemas/Timestamp'
  completed_at:
    $ref: '#/components/schemas/Timestamp'
  failed_at:
    $ref: '#/components/schemas/Timestamp'
