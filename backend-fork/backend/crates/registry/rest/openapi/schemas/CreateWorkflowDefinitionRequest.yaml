type: object
required:
- workflow_key
- display_name
- object_type
properties:
  workflow_key:
    type: string
  display_name:
    type: string
  object_type:
    type: string
  definition:
    type: object
    additionalProperties: true
  approval_line:
    type: array
    items:
      type: object
      additionalProperties: true
  payment_line:
    type: array
    items:
      type: object
      additionalProperties: true
  notification_rules:
    type: array
    items:
      type: object
      additionalProperties: true
  action_allowlist:
    type: array
    items:
      $ref: '#/components/schemas/WorkflowActionAllowlistEntry'
  required_approval_line:
    type: boolean
  required_payment_line:
    type: boolean
