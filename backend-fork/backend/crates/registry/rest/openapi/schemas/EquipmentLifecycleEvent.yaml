type: object
required:
- id
- kind
- label
properties:
  id:
    type: string
  kind:
    type: string
  label:
    type: string
  description:
    type:
    - string
    - 'null'
  event_date:
    oneOf:
    - $ref: '#/components/schemas/Date'
    - type: 'null'
  occurred_at:
    oneOf:
    - $ref: '#/components/schemas/Timestamp'
    - type: 'null'
  href:
    type:
    - string
    - 'null'
