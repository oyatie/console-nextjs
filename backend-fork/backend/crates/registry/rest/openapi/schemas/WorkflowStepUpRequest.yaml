type: object
description: Fresh passkey step-up assertion for a sensitive Workflow Studio mutation.
required:
- step_up
properties:
  step_up:
    $ref: '#/components/schemas/PasskeyStepUpAssertion'
  four_eyes_request_ref:
    type:
    - string
    - 'null'
    format: uuid
    description: >-
      §16 org-scope automation gate (85 판정). Required to publish (direct-activate) an org-scope definition;
      a personal-scope definition (§3.9.0-①) ignores this and publishes directly. References a gov_approvals
      request_ref recorded by a distinct approver.
