type: object
required:
- decision
- findings
properties:
  decision:
    type: string
    enum:
    - ready
    - blocked
  findings:
    type: array
    items:
      $ref: '#/components/schemas/WorkflowSimulationFinding'
  simulated_path:
    type: array
    description: For a wf.exec.v1 definition, the ordered node keys that would execute for the sample context
      (the branch actually taken), stopping at the first human task or terminal node. Absent for non-executable definitions.
    items:
      type: string
