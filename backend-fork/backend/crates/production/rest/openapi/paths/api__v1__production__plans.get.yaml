operationId: listProductionPlans
tags: [Production]
security: [{bearerAuth: []}]
parameters:
- name: branch_id
  in: query
  required: true
  schema: {$ref: '#/components/schemas/Uuid'}
- name: limit
  in: query
  schema: {type: integer, minimum: 1, maximum: 100, default: 25}
- name: offset
  in: query
  schema: {type: integer, minimum: 0, default: 0}
responses:
  '200': {description: Tenant- and branch-authorized production plans, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ProductionPlan'}}}}}
  '401': {$ref: '#/components/responses/Unauthorized'}
  '403': {$ref: '#/components/responses/Forbidden'}
