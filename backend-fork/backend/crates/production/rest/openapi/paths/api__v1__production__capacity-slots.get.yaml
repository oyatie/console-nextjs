operationId: listProductionCapacitySlots
tags: [Production]
security: [{bearerAuth: []}]
parameters:
- {name: branch_id, in: query, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
- {name: capacity_date, in: query, required: true, schema: {type: string, format: date}}
responses:
  '200': {description: Tenant and branch scoped capacity slots, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ProductionCapacitySlot'}}}}}
