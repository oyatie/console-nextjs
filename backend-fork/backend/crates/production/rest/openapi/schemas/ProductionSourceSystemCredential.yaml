type: object
required: [id, source_system, enabled, credential_generation, secret]
properties:
  id: {$ref: '#/components/schemas/Uuid'}
  source_system: {type: string}
  enabled: {type: boolean, description: Always true for a newly registered or rotated source system.}
  credential_generation: {type: integer, format: int32, minimum: 1}
  secret: {type: string, readOnly: true, description: One-time standard-base64 disclosure of exactly 32 server-generated bytes.}
