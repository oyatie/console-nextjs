tags:
- finance-gl
operationId: listVouchers
summary: List general-ledger vouchers (tenant-scoped; optional branch/status filter)
security:
- bearerAuth: []
parameters:
- name: branch_id
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/Uuid'
- name: status
  in: query
  required: false
  schema:
    $ref: '#/components/schemas/VoucherStatus'
responses:
  '200':
    description: Vouchers visible to the caller.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/VoucherSummary'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
