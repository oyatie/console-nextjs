tags:
- finance-gl
operationId: submitVoucher
summary: 기표 → 차대검증 (balance gate; unbalanced is rejected)
security:
- bearerAuth: []
parameters:
- name: voucher_id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: Voucher advanced to 차대검증.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/VoucherSummary'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
  '409':
    $ref: '#/components/responses/Conflict'
  '422':
    $ref: '#/components/responses/ValidationError'
