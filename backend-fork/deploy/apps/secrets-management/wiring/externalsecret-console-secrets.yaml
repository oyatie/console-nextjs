# ExternalSecret: project the application secret `console-secrets` out of OpenBao into
# the maintenance namespace as the SAME native k8s Secret the pods already consume
# (console-app / console-worker read it via `envFrom.secretRef: console-secrets` — see
# deploy/apps/console/base/backend.yaml + worker.yaml). Running pods need ZERO
# change. Source of truth: deploy/SECRETS.md. ADR-0024 roadmap item 2.
#
# `dataFrom.extract` projects EVERY field of the KV entry into the Secret, so the
# Secret keys == the KV field names. Store the fields in OpenBao under the exact
# env-var names the app expects (README.md documents this):
#   CONSOLE_JWT_PRIVATE_KEY_PEM, CONSOLE_JWT_PUBLIC_KEY_PEM (ES256 keypair),
#   CONSOLE_S3_ACCESS_KEY_ID, CONSOLE_S3_SECRET_ACCESS_KEY (OCI evidence-bucket S3 creds),
#   CONSOLE_MAIL_MASTER_KEY (base64 32-byte webmail KEK).
# Optional integration keys (CONSOLE_EMAIL_SMTP_USERNAME/PASSWORD, CONSOLE_COLDSTART_OTP,
# CONSOLE_FCM_*, CONSOLE_SOLAPI_*) flow through automatically once added to the KV path —
# no edit here, mirroring the whole-secret envFrom behaviour.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: console-secrets
  namespace: console
  labels:
    app.kubernetes.io/part-of: console-substrate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-console
    kind: ClusterSecretStore
  target:
    name: console-secrets           # the k8s Secret ESO creates/owns in maintenance
    creationPolicy: Owner        # ESO creates + fully manages this Secret
  dataFrom:
    - extract:
        key: console/app     # KV v2 path under the `secret` mount
