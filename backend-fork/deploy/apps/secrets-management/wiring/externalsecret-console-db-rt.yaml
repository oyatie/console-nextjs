# ExternalSecret: project the runtime DB connection `console-db-rt` out of OpenBao.
# This is the least-privilege console_rt (NOSUPERUSER, NOBYPASSRLS) role connection
# read by console-app / console-worker (`DATABASE_URL` <- key `uri`) AND by CNPG, which
# binds the managed console_rt role's password from this Secret
# (deploy/apps/console/base/database.yaml `passwordSecret: console-db-rt`).
# Same Secret name + keys as today (deploy/SECRETS.md) -> zero pod/CNPG change.
# ADR-0024 roadmap item 2.
#
# NOTE (cutover ordering): console-db-rt must exist BEFORE the maintenance app first
# syncs so CNPG can bind console_rt with LOGIN. The README runbook seeds the KV path
# and verifies this Secret projects before retiring the manual `kubectl create
# secret`. NOT console-db-app: that owner/migration Secret is auto-generated by CNPG
# and is intentionally NOT projected here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: console-db-rt
  namespace: console
  labels:
    app.kubernetes.io/part-of: console-substrate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-console
    kind: ClusterSecretStore
  target:
    name: console-db-rt
    creationPolicy: Owner
  data:
    - secretKey: username         # key in the resulting k8s Secret
      remoteRef:
        key: console/db/rt    # KV v2 path under the `secret` mount
        property: username        # field within that KV entry
    - secretKey: password
      remoteRef:
        key: console/db/rt
        property: password
    - secretKey: uri              # postgresql://console_rt:<pw>@console-db-rw.console.svc:5432/console
      remoteRef:
        key: console/db/rt
        property: uri
