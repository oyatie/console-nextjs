name: Source and inquiry checks

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source_and_inquiry:
    name: source-and-inquiry
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Keep the full application/test links within the hosted runner budget.
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Full npm dependency audits
        run: |
          npm audit --audit-level=low
          npm --prefix backend-fork audit --audit-level=low
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:source-closure
      - name: Frozen source and fork custody
        run: |
          PYTHONPATH=tools python3 -c 'import json,acceptance; result=acceptance.inspect_fork(); print(json.dumps(result,indent=2)); raise SystemExit(result["status"] != "passed")'
      - run: npm run test:production-routes
      - run: node --test tools/test-production-runtime.test.mjs
      - run: node --test tools/browser-business-failure.test.mjs tools/browser-business-temporal.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: node --test tools/enrollment-fault-deadlines.test.mjs tools/test-native-browser-enrollment.test.mjs
      - name: Source parser and certificate CLI security regressions
        run: node --test backend-fork/scripts/check-request-body-contract.test.mjs backend-fork/scripts/korean-connectivity/local-certificate-agent.test.mjs
      - name: Private import artifact security regressions
        run: |
          python3 -m venv "$RUNNER_TEMP/importer-test-venv"
          "$RUNNER_TEMP/importer-test-venv/bin/python" -m pip install --require-hashes -r backend-fork/scripts/importer-test-requirements.txt
          "$RUNNER_TEMP/importer-test-venv/bin/python" -m unittest discover -s backend-fork/scripts -p 'test_*import*.py' -v
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: rustup component add clippy rustfmt --toolchain 1.98.1
      - name: JWT provider closure across shipped and tested targets
        id: jwt_provider_graph
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import pathlib
          import subprocess
          import sys
          proof = pathlib.Path(os.environ["RUNNER_TEMP"]) / "jwt-provider-graph.json"
          with proof.open("w") as output:
              result = subprocess.run(["python3", "tools/check-jwt-provider-graph.py"], stdout=output, check=False)
          value = json.loads(proof.read_text())
          value["rows"] = [{key: item for key, item in row.items() if key not in ("stdout", "stderr")} for row in value["rows"]]
          print(json.dumps(value, indent=2))
          sys.exit(result.returncode)
          PYCODE
      - name: Rust advisory policy
        working-directory: backend-fork/backend
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: Rust format
        working-directory: backend-fork/backend
        run: cargo fmt --all -- --check
      - name: Rust build disk budget
        run: df -h .
      - name: PostgreSQL device-login source revocation and authentication owners
        env:
          SQLX_OFFLINE: "true"
          FRONTEND_ROOT: ${{ github.workspace }}
        run: |
          python3 - <<'PYCODE'
          import os
          import subprocess
          import sys
          harness = ["backend-fork/tools/lanes/pgtest.sh", os.environ["GITHUB_WORKSPACE"] + "/backend-fork"]
          commands = [
              harness + ["cargo", "test", "--locked", "--no-fail-fast", "-p", "console-identity-rest", "--lib", "--test", "authentication_locking", "--", "--test-threads=1"],
              harness + ["cargo", "test", "--locked", "--no-fail-fast", "-p", "console-platform-auth-rest", "-p", "console-platform-auth", "-p", "console-platform-request-context", "--lib", "--", "--test-threads=1"],
              harness + ["cargo", "test", "--locked", "--features", "frontend-e2e", "-p", "console-app", "--test", "auth_rest", "--", "--test-threads=1", "--show-output"],
              harness + ["cargo", "test", "--locked", "-p", "console-app", "--test", "policy_bulk_admission_api", "--", "--test-threads=1"],
              harness + ["cargo", "test", "--locked", "-p", "console-platform-rest", "--test", "platform_groups", "--", "--test-threads=1"],
              harness + ["cargo", "test", "--locked", "--no-fail-fast", "-p", "console-platform-auth", "--test", "credential_identity", "--test", "refresh_tokens", "--test", "session_locking", "--test", "webauthn_ceremony_replay", "--test", "webauthn_registration_deactivated_user", "--test", "webauthn_contention", "--test", "webauthn_ceremony", "--test", "jwt_es256", "--test", "jwt_verifier", "--", "--test-threads=1"],
              harness + ["cargo", "test", "--locked", "-p", "console-platform-auth-rest", "--test", "group_admin_tenant_context", "--test", "dev_auth_absence", "--", "--test-threads=1"],
              harness + ["cargo", "test", "--locked", "-p", "console-platform-auth-rest", "--features", "dev-auth", "--lib", "--test", "dev_auth_session", "--", "--test-threads=1"],
              harness + ["cargo", "test", "--locked", "--no-fail-fast", "-p", "console-platform-db", "--test", "auth_security_state", "--test", "auth_command_role", "--", "--test-threads=1"],
              harness + ["cargo", "test", "--locked", "--no-fail-fast", "-p", "console-platform-provisioning", "--test", "account_locking", "--test", "account_identity", "--test", "rls_auth_chain_as_runtime_role", "--", "--test-threads=1"],
          ]
          outcomes = [subprocess.run(command, check=False).returncode for command in commands]
          sys.exit(1 if any(outcomes) else 0)
          PYCODE
      - name: Identity REST owner and device-login regression Clippy
        env:
          SQLX_OFFLINE: "true"
        working-directory: backend-fork/backend
        run: cargo clippy --locked -p console-identity-rest --lib --test authentication_locking -- -D warnings
      - name: Authentication owners Clippy
        env:
          SQLX_OFFLINE: "true"
        working-directory: backend-fork/backend
        run: cargo clippy --locked -p console-platform-auth-rest -p console-platform-auth -p console-platform-request-context --lib -- -D warnings
      - name: Browser session compatible owners and regressions Clippy
        env:
          SQLX_OFFLINE: "true"
        working-directory: backend-fork/backend
        run: |
          cargo clippy --locked -p console-platform-auth --test credential_identity --test refresh_tokens --test session_locking --test webauthn_ceremony_replay --test webauthn_registration_deactivated_user --test webauthn_contention --test webauthn_ceremony --test jwt_es256 --test jwt_verifier -- -D warnings
          cargo clippy --locked -p console-platform-auth-rest --test group_admin_tenant_context --test dev_auth_absence -- -D warnings
          cargo clippy --locked -p console-platform-auth-rest --features dev-auth --lib --test dev_auth_session -- -D warnings
          cargo clippy --locked -p console-platform-db --test auth_security_state --test auth_command_role -- -D warnings
          cargo clippy --locked -p console-contracts -p console-orgchange-rest --lib -- -D warnings
      - name: Credential reset owner and regressions Clippy
        env:
          SQLX_OFFLINE: "true"
        working-directory: backend-fork/backend
        run: |
          cargo clippy --locked -p console-app --features frontend-e2e --lib --test auth_rest --test health_readiness --test current_authority -- -D warnings
          cargo clippy --locked -p console-app --test policy_bulk_admission_api -- -D warnings
          cargo clippy --locked -p console-platform-authz-rest --lib -- -D warnings
          cargo clippy --locked -p console-platform-rest --test platform_groups -- -D warnings
          cargo clippy --locked -p console-platform-provisioning --lib --test account_locking --test account_identity --test rls_auth_chain_as_runtime_role -- -D warnings
      - name: Office JWT and mail TLS dependency compatibility
        env:
          SQLX_OFFLINE: "true"
        working-directory: backend-fork/backend
        run: |
          cargo test --locked -p console-app --lib office::tests -- --test-threads=1
          bash "$GITHUB_WORKSPACE/backend-fork/tools/lanes/pgtest.sh" "$GITHUB_WORKSPACE/backend-fork" cargo test --locked -p console-comms-adapter-smtp -p console-comms-adapter-imap -p console-platform-email -p console-platform-storage --lib -- --test-threads=1
          cargo clippy --locked -p console-comms-adapter-smtp -p console-comms-adapter-imap -p console-platform-email -p console-platform-storage --lib -- -D warnings
      - name: PostgreSQL payroll source validation, roster and workflow recovery
        env:
          SQLX_OFFLINE: "true"
        run: |
          python3 - <<'PYCODE'
          import os
          import subprocess
          import sys
          harness = ["backend-fork/tools/lanes/pgtest.sh", os.environ["GITHUB_WORKSPACE"] + "/backend-fork"]
          commands = [
              harness + ["cargo", "test", "--locked", "--no-fail-fast", "-p", "console-payroll-adapter-postgres", "--lib", "--test", "pay_run_port_as_runtime_role", "--test", "roster_materialisation", "--test", "payroll_lifecycle_rls_as_runtime_role", "--test", "payroll_rls_surfaces_as_runtime_role", "--", "--test-threads=1"],
              harness + ["cargo", "test", "--locked", "-p", "console-workflow-runtime-adapter-postgres", "--test", "payroll_drain_period_lock", "--", "--test-threads=1"],
              harness + ["cargo", "test", "--locked", "--no-fail-fast", "-p", "console-payroll-rest", "--lib", "--test", "run_lifecycle_api", "--test", "api", "--", "--test-threads=1"],
              harness + ["cargo", "test", "--locked", "-p", "console-app", "--test", "health_readiness", "--", "--test-threads=1"],
              harness + ["cargo", "test", "--locked", "-p", "console-payroll-ui", "--lib", "--", "--test-threads=1"],
              harness + ["cargo", "test", "--locked", "-p", "console-inbox-adapter-postgres", "--test", "inbox_docs_rls_surfaces_as_runtime_role", "--", "--test-threads=1"],
              harness + ["cargo", "test", "--locked", "-p", "console-inbox-rest", "--test", "api", "--", "--test-threads=1"],
              harness + ["cargo", "test", "--locked", "-p", "console-leave-adapter-postgres", "--test", "leave_rls_surfaces_as_runtime_role", "--", "--test-threads=1"],
              harness + ["cargo", "test", "--locked", "--no-fail-fast", "-p", "console-platform-db", "--lib", "--test", "rls_isolation", "--", "--test-threads=1"],
          ]
          outcomes = [subprocess.run(command, check=False).returncode for command in commands]
          sys.exit(1 if any(outcomes) else 0)
          PYCODE
      - name: Payroll owner and regression Clippy
        env:
          SQLX_OFFLINE: "true"
        working-directory: backend-fork/backend
        run: cargo clippy --locked -p console-payroll-adapter-postgres --lib --test pay_run_port_as_runtime_role --test payroll_rls_surfaces_as_runtime_role -- -D warnings
      - name: Audited snapshot owner and regression Clippy
        env:
          SQLX_OFFLINE: "true"
        working-directory: backend-fork/backend
        run: cargo clippy --locked -p console-platform-db --lib --test rls_isolation -- -D warnings
      - name: Workflow owner and regression Clippy
        env:
          SQLX_OFFLINE: "true"
        working-directory: backend-fork/backend
        run: cargo clippy --locked -p console-workflow-runtime-adapter-postgres --lib --test payroll_drain_period_lock -- -D warnings
      - name: Payroll REST and UI owners and regression Clippy
        env:
          SQLX_OFFLINE: "true"
        working-directory: backend-fork/backend
        run: |
          cargo clippy --locked -p console-payroll-rest --lib --test run_lifecycle_api --test api -- -D warnings
          cargo clippy --locked -p console-payroll-ui --lib -- -D warnings
      - name: Inbox owner and regression Clippy
        env:
          SQLX_OFFLINE: "true"
        working-directory: backend-fork/backend
        run: |
          cargo clippy --locked -p console-inbox-adapter-postgres --lib --test inbox_docs_rls_surfaces_as_runtime_role -- -D warnings
          cargo clippy --locked -p console-inbox-rest --lib --test api -- -D warnings
      - name: Leave consumer and regression Clippy
        env:
          SQLX_OFFLINE: "true"
        working-directory: backend-fork/backend
        run: cargo clippy --locked -p console-leave-adapter-postgres --lib --test leave_rls_surfaces_as_runtime_role -- -D warnings
      - name: PostgreSQL and real-browser inquiry
        env:
          SQLX_OFFLINE: "true"
          FRONTEND_ROOT: ${{ github.workspace }}
        run: backend-fork/tools/lanes/pgtest.sh "$GITHUB_WORKSPACE/backend-fork" cargo test --locked --features frontend-e2e -p console-sales-rest --test public_inquiry --test real_browser_inquiry -- --test-threads=1
      - name: PostgreSQL sales store and runtime-role isolation
        env:
          SQLX_OFFLINE: "true"
        run: backend-fork/tools/lanes/pgtest.sh "$GITHUB_WORKSPACE/backend-fork" cargo test --locked -p console-sales-adapter-postgres --test inquiry_rls_surfaces_as_runtime_role --test sales_store -- --test-threads=1
      - name: Attendance source parser regressions
        env:
          SQLX_OFFLINE: "true"
          RUSTUP_TOOLCHAIN: "1.98.1"
        run: cargo test --manifest-path backend-fork/backend/Cargo.toml --locked -p console-app --lib hr::tests::attendance_import -- --test-threads=1
      - name: PostgreSQL attendance retained history and Company isolation
        env:
          SQLX_OFFLINE: "true"
        run: backend-fork/tools/lanes/pgtest.sh "$GITHUB_WORKSPACE/backend-fork" cargo test --locked -p console-attendance-adapter-postgres --test self_service -- --test-threads=1
      - name: Attendance read owner and regression Clippy
        env:
          SQLX_OFFLINE: "true"
          RUSTUP_TOOLCHAIN: "1.98.1"
        run: cargo clippy --manifest-path backend-fork/backend/Cargo.toml --locked -p console-attendance-adapter-postgres --lib --test self_service -- -D warnings
      - name: PostgreSQL HR attendance source fidelity, import gates and scoped raw history
        env:
          SQLX_OFFLINE: "true"
        run: backend-fork/tools/lanes/pgtest.sh "$GITHUB_WORKSPACE/backend-fork" cargo test --locked -p console-app --test current_authority --test hr_ingest_checklist_gate --test hr_attendance_self_read --test hr_attendance_manager_scope --test openapi_drift -- --test-threads=1
      - name: PostgreSQL authorized read snapshot
        env:
          SQLX_OFFLINE: "true"
        run: backend-fork/tools/lanes/pgtest.sh "$GITHUB_WORKSPACE/backend-fork" cargo test --locked -p console-platform-db --test rls_isolation with_org_snapshot_arms_rls_before_repeatable_read_only_queries -- --exact --test-threads=1
      - name: HR owner and regression Clippy
        env:
          SQLX_OFFLINE: "true"
          RUSTUP_TOOLCHAIN: "1.98.1"
        run: cargo clippy --manifest-path backend-fork/backend/Cargo.toml --locked -p console-app --lib --test hr_ingest_checklist_gate --test hr_attendance_self_read --test hr_attendance_manager_scope --test openapi_drift -- -D warnings
      - name: Rust build disk readback
        if: always()
        run: df -h .
      - name: Preserve complete JWT provider graph evidence
        if: ${{ always() && steps.jwt_provider_graph.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jwt-provider-graph
          path: ${{ runner.temp }}/jwt-provider-graph.json
          if-no-files-found: error
          retention-days: 30
