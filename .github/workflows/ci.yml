name: Source and inquiry checks

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source_and_inquiry:
    name: source-and-inquiry
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Keep the full application/test links within the hosted runner budget.
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:production-routes
      - run: npx playwright install --with-deps chromium
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: rustup component add clippy --toolchain 1.98.1
      - name: Rust build disk budget
        run: df -h .
      - name: PostgreSQL payroll source validation, roster and workflow recovery
        env:
          SQLX_OFFLINE: "true"
        run: |
          python3 - <<'PYCODE'
          import os
          import subprocess
          import sys
          harness = ["backend-fork/tools/lanes/pgtest.sh", os.environ["GITHUB_WORKSPACE"] + "/backend-fork"]
          commands = [
              harness + ["cargo", "test", "--locked", "--no-fail-fast", "-p", "console-payroll-adapter-postgres", "--lib", "--test", "pay_run_port_as_runtime_role", "--test", "roster_materialisation", "--test", "payroll_lifecycle_rls_as_runtime_role", "--test", "payroll_rls_surfaces_as_runtime_role", "--", "--test-threads=1"],
              harness + ["cargo", "test", "--locked", "-p", "console-workflow-runtime-adapter-postgres", "--test", "payroll_drain_period_lock", "--", "--test-threads=1"],
              harness + ["cargo", "test", "--locked", "--no-fail-fast", "-p", "console-payroll-rest", "--lib", "--test", "run_lifecycle_api", "--test", "api", "--", "--test-threads=1"],
              harness + ["cargo", "test", "--locked", "-p", "console-inbox-adapter-postgres", "--test", "inbox_docs_rls_surfaces_as_runtime_role", "--", "--test-threads=1"],
              harness + ["cargo", "test", "--locked", "-p", "console-leave-adapter-postgres", "--test", "leave_rls_surfaces_as_runtime_role", "--", "--test-threads=1"],
              harness + ["cargo", "test", "--locked", "--no-fail-fast", "-p", "console-platform-db", "--lib", "--test", "rls_isolation", "--", "--test-threads=1"],
          ]
          outcomes = [subprocess.run(command, check=False).returncode for command in commands]
          sys.exit(1 if any(outcomes) else 0)
          PYCODE
      - name: Payroll owner and regression Clippy
        env:
          SQLX_OFFLINE: "true"
        working-directory: backend-fork/backend
        run: cargo clippy --locked -p console-payroll-adapter-postgres --lib --test pay_run_port_as_runtime_role --test payroll_rls_surfaces_as_runtime_role -- -D warnings
      - name: Audited snapshot owner and regression Clippy
        env:
          SQLX_OFFLINE: "true"
        working-directory: backend-fork/backend
        run: cargo clippy --locked -p console-platform-db --lib --test rls_isolation -- -D warnings
      - name: Workflow owner and regression Clippy
        env:
          SQLX_OFFLINE: "true"
        working-directory: backend-fork/backend
        run: cargo clippy --locked -p console-workflow-runtime-adapter-postgres --lib --test payroll_drain_period_lock -- -D warnings
      - name: Payroll REST owner and regression Clippy
        env:
          SQLX_OFFLINE: "true"
        working-directory: backend-fork/backend
        run: cargo clippy --locked -p console-payroll-rest --lib --test run_lifecycle_api --test api -- -D warnings
      - name: Inbox owner and regression Clippy
        env:
          SQLX_OFFLINE: "true"
        working-directory: backend-fork/backend
        run: cargo clippy --locked -p console-inbox-adapter-postgres --lib --test inbox_docs_rls_surfaces_as_runtime_role -- -D warnings
      - name: Leave consumer and regression Clippy
        env:
          SQLX_OFFLINE: "true"
        working-directory: backend-fork/backend
        run: cargo clippy --locked -p console-leave-adapter-postgres --lib --test leave_rls_surfaces_as_runtime_role -- -D warnings
      - name: PostgreSQL and real-browser inquiry
        env:
          SQLX_OFFLINE: "true"
          FRONTEND_ROOT: ${{ github.workspace }}
        run: backend-fork/tools/lanes/pgtest.sh "$GITHUB_WORKSPACE/backend-fork" cargo test --locked --features frontend-e2e -p console-sales-rest --test public_inquiry --test real_browser_inquiry -- --test-threads=1
      - name: PostgreSQL sales store and runtime-role isolation
        env:
          SQLX_OFFLINE: "true"
        run: backend-fork/tools/lanes/pgtest.sh "$GITHUB_WORKSPACE/backend-fork" cargo test --locked -p console-sales-adapter-postgres --test inquiry_rls_surfaces_as_runtime_role --test sales_store -- --test-threads=1
      - name: Attendance source parser regressions
        env:
          SQLX_OFFLINE: "true"
          RUSTUP_TOOLCHAIN: "1.98.1"
        run: cargo test --manifest-path backend-fork/backend/Cargo.toml --locked -p console-app --lib hr::tests::attendance_import -- --test-threads=1
      - name: PostgreSQL attendance retained history and Company isolation
        env:
          SQLX_OFFLINE: "true"
        run: backend-fork/tools/lanes/pgtest.sh "$GITHUB_WORKSPACE/backend-fork" cargo test --locked -p console-attendance-adapter-postgres --test self_service -- --test-threads=1
      - name: Attendance read owner and regression Clippy
        env:
          SQLX_OFFLINE: "true"
          RUSTUP_TOOLCHAIN: "1.98.1"
        run: cargo clippy --manifest-path backend-fork/backend/Cargo.toml --locked -p console-attendance-adapter-postgres --lib --test self_service -- -D warnings
      - name: PostgreSQL HR attendance source fidelity, import gates and scoped raw history
        env:
          SQLX_OFFLINE: "true"
        run: backend-fork/tools/lanes/pgtest.sh "$GITHUB_WORKSPACE/backend-fork" cargo test --locked -p console-app --test hr_ingest_checklist_gate --test hr_attendance_self_read --test hr_attendance_manager_scope --test openapi_drift -- --test-threads=1
      - name: PostgreSQL authorized read snapshot
        env:
          SQLX_OFFLINE: "true"
        run: backend-fork/tools/lanes/pgtest.sh "$GITHUB_WORKSPACE/backend-fork" cargo test --locked -p console-platform-db --test rls_isolation with_org_snapshot_arms_rls_before_repeatable_read_only_queries -- --exact --test-threads=1
      - name: HR owner and regression Clippy
        env:
          SQLX_OFFLINE: "true"
          RUSTUP_TOOLCHAIN: "1.98.1"
        run: cargo clippy --manifest-path backend-fork/backend/Cargo.toml --locked -p console-app --lib --test hr_ingest_checklist_gate --test hr_attendance_self_read --test hr_attendance_manager_scope --test openapi_drift -- -D warnings
      - name: Rust build disk readback
        if: always()
        run: df -h .
